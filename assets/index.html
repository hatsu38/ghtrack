<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ghtrack — workflow duration trends</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #57606a;
      --border: #d0d7de;
      --accent: #1f6feb;
      --card: #f6f8fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #58a6ff;
        --card: #161b22;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.5;
    }

    main { max-width: 960px; margin: 0 auto; }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    h1 { margin: 0 0 4px; font-size: 28px; font-weight: 600; }
    h1 a { color: inherit; text-decoration: none; }

    .subtitle { color: var(--muted); font-size: 14px; margin: 0; }

    section { margin-bottom: 36px; }
    h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }

    .chart-wrap {
      position: relative;
      height: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .meta {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      padding: 36px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .controls {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .controls label {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .controls input[type="checkbox"] { cursor: pointer; }

    footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<main>
  <header>
    <h1><a href="https://github.com/hatsu38/ghtrack">ghtrack</a></h1>
    <p class="subtitle">Workflow run duration trends, captured by ghtrack.</p>
  </header>

  <section>
    <h2>Total duration per run</h2>
    <div class="chart-wrap"><canvas id="totalChart"></canvas></div>
    <p class="meta" id="totalMeta"></p>
  </section>

  <section>
    <h2>Per-job duration</h2>
    <p class="controls">
      <label>
        <input type="checkbox" id="groupMatrixToggle">
        matrix を集約 (max) して表示
      </label>
    </p>
    <div class="chart-wrap"><canvas id="jobChart"></canvas></div>
    <p class="meta" id="jobMeta"></p>
  </section>

  <footer>
    Powered by <a href="https://github.com/hatsu38/ghtrack">ghtrack</a> ·
    Charts by <a href="https://www.chartjs.org/">Chart.js</a>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
(function () {
  "use strict";

  function replaceWithEmpty(canvasId, message) {
    const el = document.getElementById(canvasId);
    if (!el) return;
    const div = document.createElement("div");
    div.className = "empty";
    div.textContent = message;
    el.parentNode.replaceChild(div, el);
  }

  function chartOptions(tooltipExtra) {
    return {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      scales: {
        x: {
          type: "time",
          time: { tooltipFormat: "yyyy-MM-dd HH:mm" },
          title: { display: true, text: "Date" },
        },
        y: {
          beginAtZero: true,
          title: { display: true, text: "Seconds" },
        },
      },
      plugins: {
        legend: { display: true, position: "top" },
        tooltip: {
          callbacks: {
            afterBody(items) {
              if (!items || items.length === 0 || !tooltipExtra) return "";
              const lines = tooltipExtra(items[0].raw);
              return lines.filter(Boolean).join("\n");
            },
          },
        },
      },
    };
  }

  const PALETTE = [
    "#1f6feb", "#bf8700", "#bc4c00", "#3fb950",
    "#a371f7", "#db61a2", "#0a3069", "#bc8cff",
  ];

  function colorAt(i) { return PALETTE[i % PALETTE.length]; }

  function workflowKey(entry) {
    return entry.workflow_file || entry.workflow || "(unknown)";
  }

  // matrix permutation の job 名(末尾が "(N)" や "(N, M)" など)を検出して、
  // base 名の下にまとめるためのキー変換。
  const MATRIX_RE = /^(.+?) \(\d+(?:, *\d+)*\)$/;
  function groupKeyFor(name, on) {
    if (!on) return name;
    const m = MATRIX_RE.exec(name);
    return m ? `${m[1]} (matrix)` : name;
  }

  const GROUP_MATRIX_STORAGE_KEY = "ghtrack:groupMatrix";
  function getMatrixGrouping() {
    try {
      const v = localStorage.getItem(GROUP_MATRIX_STORAGE_KEY);
      return v === null ? true : v === "true";
    } catch (_) {
      return true;
    }
  }
  function setMatrixGrouping(value) {
    try {
      localStorage.setItem(GROUP_MATRIX_STORAGE_KEY, value ? "true" : "false");
    } catch (_) { /* private mode 等で無視 */ }
  }

  function groupByKey(entries, keyFn) {
    const map = new Map();
    for (const e of entries) {
      const key = keyFn(e);
      const list = map.get(key) ?? [];
      list.push(e);
      map.set(key, list);
    }
    return map;
  }

  function buildTotalChart(entries) {
    const usable = entries.filter((e) => typeof e.total_duration_sec === "number");
    if (usable.length === 0) {
      replaceWithEmpty("totalChart", "No total_duration_sec recorded yet.");
      return;
    }
    const grouped = groupByKey(usable, workflowKey);
    const datasets = Array.from(grouped.entries()).map(([wf, list], i) => {
      const color = colorAt(i);
      return {
        label: wf,
        data: list.map((e) => ({ x: e.date, y: e.total_duration_sec, raw: e })),
        borderColor: color,
        backgroundColor: color + "26",
        tension: 0.25,
        fill: grouped.size === 1,
        pointRadius: 3,
      };
    });
    new Chart(document.getElementById("totalChart"), {
      type: "line",
      data: { datasets },
      options: chartOptions((point) => {
        const e = point.raw;
        if (!e) return [];
        return [
          `commit ${String(e.commit).slice(0, 7)}`,
          `workflow: ${e.workflow}`,
          `event: ${e.event}`,
          e.run_attempt && e.run_attempt > 1 ? `run_attempt: ${e.run_attempt}` : null,
        ];
      }),
    });
    document.getElementById("totalMeta").textContent =
      `${usable.length} runs across ${grouped.size} workflow(s) ` +
      `(latest: ${new Date(usable[usable.length - 1].date).toLocaleString()})`;
  }

  function buildJobChart(entries, opts) {
    const groupMatrix = !!(opts && opts.groupMatrix);
    const canvas = document.getElementById("jobChart");
    if (!canvas) return;

    // toggle 切替時の再描画に備え、既存 instance があれば破棄する。
    const existing = Chart.getChart && Chart.getChart(canvas);
    if (existing) existing.destroy();

    // ${workflow_file}::${groupName} で集計。groupMatrix=true の時は matrix の
    // permutation 群を base 名 "(matrix)" にまとめ、各 run で max を取る。
    const seen = new Map();
    for (const e of entries) {
      const wf = workflowKey(e);
      for (const j of e.jobs) {
        const groupName = groupKeyFor(j.name, groupMatrix);
        const key = `${wf}::${groupName}`;
        if (!seen.has(key)) seen.set(key, { workflow: wf, groupName });
      }
    }
    if (seen.size === 0) {
      replaceWithEmpty("jobChart", "No jobs recorded yet.");
      return;
    }

    const datasets = Array.from(seen.entries()).map(([key, meta], i) => {
      const data = entries
        .filter((e) => workflowKey(e) === meta.workflow)
        .map((e) => {
          const matched = e.jobs.filter(
            (j) => groupKeyFor(j.name, groupMatrix) === meta.groupName,
          );
          const withDuration = matched.filter((j) => typeof j.duration_sec === "number");
          if (withDuration.length === 0) return null;
          // max を取る = 並列実行で wall-clock を決める bottleneck node
          const slowest = withDuration.reduce(
            (a, b) => (a.duration_sec >= b.duration_sec ? a : b),
          );
          return {
            x: e.date,
            y: slowest.duration_sec,
            raw: e,
            jobRaw: slowest,
            matrixCount: matched.length,
            groupName: meta.groupName,
          };
        })
        .filter((p) => p !== null);
      const color = colorAt(i);
      return {
        label: key,
        data,
        borderColor: color,
        backgroundColor: color + "22",
        tension: 0.25,
        spanGaps: true,
        pointRadius: 3,
      };
    });

    new Chart(canvas, {
      type: "line",
      data: { datasets },
      options: chartOptions((point) => {
        if (!point || !point.raw) return [];
        const lines = [`workflow: ${point.raw.workflow}`];
        if (point.matrixCount > 1) {
          lines.push(`job: ${point.groupName} (max of ${point.matrixCount} matrix nodes)`);
          lines.push(`slowest: ${point.jobRaw.name}`);
        } else {
          lines.push(`job: ${point.jobRaw.name}`);
        }
        lines.push(`commit ${String(point.raw.commit).slice(0, 7)}`);
        lines.push(`conclusion: ${point.jobRaw.conclusion ?? "-"}`);
        return lines;
      }),
    });
    document.getElementById("jobMeta").textContent =
      `${seen.size} job(s) tracked across ${entries.length} run(s)` +
      (groupMatrix ? " (matrix aggregated)" : "") + ".";
  }

  function fetchJson(path) {
    return fetch(path, { cache: "no-cache" }).then((res) => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    });
  }

  // manifest があれば複数ソース対応、無ければ従来パスへフォールバック。
  // 古い gh-pages(manifest 未生成)とも互換を保つ。
  function resolveSourcePaths() {
    return fetchJson("./data/manifest.json")
      .then((m) => {
        if (!m || !Array.isArray(m.sources) || m.sources.length === 0) {
          return ["./data/data.json"];
        }
        return m.sources
          .map((s) => s && typeof s.path === "string" ? s.path : null)
          .filter((p) => p !== null)
          .map((p) => p.startsWith("./") || p.startsWith("/") ? p : `./${p}`);
      })
      .catch(() => ["./data/data.json"]);
  }

  resolveSourcePaths()
    .then((paths) => Promise.all(
      paths.map((p) => fetchJson(p).catch((err) => {
        console.warn(`ghtrack: failed to load ${p}: ${err.message}`);
        return { entries: [] };
      })),
    ))
    .then((files) => {
      const entries = files.flatMap((f) => Array.isArray(f && f.entries) ? f.entries : []);
      if (entries.length === 0) {
        replaceWithEmpty("totalChart", "No entries yet. Run the workflow at least once.");
        replaceWithEmpty("jobChart", "");
        return;
      }
      entries.sort((a, b) => a.date - b.date);
      buildTotalChart(entries);

      const renderJob = () => buildJobChart(entries, { groupMatrix: getMatrixGrouping() });
      const toggle = document.getElementById("groupMatrixToggle");
      if (toggle) {
        toggle.checked = getMatrixGrouping();
        toggle.addEventListener("change", () => {
          setMatrixGrouping(toggle.checked);
          renderJob();
        });
      }
      renderJob();
    })
    .catch((err) => {
      replaceWithEmpty("totalChart", `Failed to load ghtrack data: ${err.message}`);
      replaceWithEmpty("jobChart", "");
    });
})();
</script>
</body>
</html>
