name: ghtrack
description: Track GitHub Actions workflow run durations over time on gh-pages.
author: hatsu38

branding:
  icon: clock
  color: blue

inputs:
  github-token:
    description: >-
      GitHub token used to read workflow run / job data and to push the
      collected JSON to the gh-pages branch. Default uses the workflow's
      GITHUB_TOKEN. The token must have `contents: write` permission to push.
    required: false
    default: ${{ github.token }}
  gh-pages-branch:
    description: Branch to which the per-run JSON files are pushed.
    required: false
    default: gh-pages
  track-name:
    description: >-
      Identifier used as the directory name under `data/`. Must match
      `[a-zA-Z0-9._-]+`. When omitted, the workflow file basename (without the
      `.yml` / `.yaml` extension) is used. Set this when you need to separate
      tracks that share a workflow file (e.g., matrix shards or environments).
    required: false

runs:
  using: node24
  main: dist/index.js
